<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SEL2701 行程图片署名（本地图片同步后填写）。" />
    <meta name="theme-color" content="#1f3a2e" />
    <title>图片署名 · SEL2701</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="site-header">
      <div class="site-brand">
        <p class="eyebrow">Credits</p>
        <h1>图片署名</h1>
        <p class="lede">本地行程图片尚未同步；同步后将在此列出作者与许可证。</p>
      </div>
    </header>
    <nav class="site-nav" aria-label="页面分区">
      <a href="index.html">返回路书</a>
      <a href="index.html#itinerary">逐日行程</a>
      <a href="index.html#bookings">已预约</a>
      <a href="index.html#pending">待办理</a>
      <a href="index.html#fallbacks">应急预案</a>
    </nav>
    <main id="main">
      <section class="panel" aria-labelledby="policy-title">
        <header class="panel-header">
          <h2 id="policy-title">署名说明</h2>
          <p>当前 <code>data/image-credits.js</code> 为空。放入 <code>assets/images</code> 并更新扩展名表后，本页会列出署名。</p>
        </header>
      </section>
      <section class="panel" aria-labelledby="table-title">
        <header class="panel-header">
          <h2 id="table-title">图片署名表（<span id="credits-count">0</span> 张）</h2>
        </header>
        <div class="booking-card">
          <table>
            <caption>行程图片署名记录</caption>
            <thead>
              <tr>
                <th scope="col">本地文件</th>
                <th scope="col">原图标题 / 行程步骤</th>
                <th scope="col">作者</th>
                <th scope="col">许可证</th>
                <th scope="col">来源</th>
                <th scope="col">取用日期</th>
              </tr>
            </thead>
            <tbody id="credits-body">
              <tr>
                <td colspan="6">暂无图片署名。</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <footer class="site-footer"><p><a href="index.html">返回路书首页</a></p></footer>
  </body>
</html>
